name: Api Gateway Service CI/CD Build and Deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway-service.yml'
jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./api-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build project
        run: mvn clean install
      - name: Login docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        working-directory: .
      - name: Build docker image
        run: docker build -t caiquepirs/api-gateway .
      - name: Publish image
        run: docker push caiquepirs/api-gateway

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pull image docker
        run: docker pull caiquepirs/api-gateway
      - name: Create docker file
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env
      - name: Run docker compose
        run: |
          docker compose up -d --no-deps api-gateway
          docker image prune -f