name: Invoice Service CI/CD Build and Deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'invoice-service/**'
      - '.github/workflows/invoice-service.yml'
jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./invoice-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build project
        run: mvn clean install
      - name: Login docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        working-directory: .
      - name: Build docker image
        run: docker build -t caiquepirs/invoice-service .
      - name: Publish image
        run: docker push caiquepirs/invoice-service

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pull image docker
        run: docker pull caiquepirs/invoice-service
      - name: Create docker file
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env
      - name: Run docker compose
        run: |
          docker compose up -d --no-deps invoice-service
          docker image prune -f
