services:
  customers-postgres:
    image: postgres:16.0
    container_name: customers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CUSTOMERS_DB}
      POSTGRES_USER: ${CUSTOMERS_USER}
      POSTGRES_PASSWORD: ${CUSTOMERS_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - billing-network

  authentication-postgres:
    image: postgres:16.0
    container_name: authentication-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTICATION_DB}
      POSTGRES_USER: ${AUTHENTICATION_USER}
      POSTGRES_PASSWORD: ${AUTHENTICATION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - authentication_postgres_data:/var/lib/postgresql/data
    networks:
      - billing-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: billing-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - billing-network

volumes:
  postgres_data:
    driver: local
  authentication_postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  billing-network:
    driver: bridge
    name: billing-network
